name: 🔄 Update Profile Stats

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 08:00) 定时自动同步一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub 仓库 Actions 页面手动一键点击触发测试

permissions:
  contents: write # 赋予 GitHub Actions 自动提交写入权限

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出仓库代码
        uses: actions/checkout@v4

      - name: 🛠️ 确保 profile 目录存在
        run: mkdir -p profile

      - name: 📊 获取最新统计与语言卡片 SVG
        run: |
          curl -s "https://github-stats-extended.vercel.app/api?username=RLlufee&show_icons=true&theme=tokyonight" -o profile/stats.svg
          curl -s "https://github-stats-extended.vercel.app/api/top-langs/?username=RLlufee&layout=compact&theme=tokyonight" -o profile/top-langs.svg

      - name: 🚀 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if git diff --staged --quiet; then
            echo "统计数据无变化，跳过提交。"
          else
            git commit -m "chore: 自动同步最新 GitHub 统计卡片 [skip ci]"
            git push
          fi
